<!doctype html>
<html lang="uz-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fair Value — Baholash firmasi</title>
<meta name="description" content="Fair Value — mol-mulkni baholash, biznes loyihalar va TEO, import shartnomasi bo'yicha ekspert xulosasi, audit xulosasi. Har bir hujjat QR kod bilan tasdiqlanadi.">
<meta name="theme-color" content="#08162e">
<meta property="og:title" content="Fair Value — Baholash firmasi">
<meta property="og:description" content="Mol-mulkni baholash, biznes loyihalar, ekspert xulosalari va audit. QR kod bilan tasdiqlanadigan hujjatlar.">
<meta property="og:image" content="/assets/logo.svg">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/config.js" defer></script>
<script src="/assets/i18n.js" defer></script>
<script src="/assets/layout.js" defer></script>
<script src="/assets/home.js" defer></script>
</head>
<body>
<div id="site-header"></div>

<!-- HERO -->
<section class="hero" id="top">
  <div class="hero-bg" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="container">
    <div>
      <span class="hero-badge" data-i18n="hero.badge"></span>
      <h1>FAIR VALUE</h1>
      <div data-divider></div>
      <p class="hero-lead" data-i18n="hero.lead"></p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#contact"><span data-i18n="cta.request"></span></a>
        <a class="btn btn-ghost" href="/verify"><span data-icon="qr" style="display:contents"></span><span data-i18n="cta.verify"></span></a>
      </div>
      <ul class="hero-points">
        <li><span class="check" data-icon="check"></span><span data-i18n="hero.p1"></span></li>
        <li><span class="check" data-icon="check"></span><span data-i18n="hero.p2"></span></li>
        <li><span class="check" data-icon="check"></span><span data-i18n="hero.p3"></span></li>
      </ul>
    </div>
    <div class="hero-card on-dark">
      <div class="qr-illus" data-qr-illus></div>
      <h3 class="center" data-i18n="hero.card.t"></h3>
      <p class="center" data-i18n="hero.card.d"></p>
      <form class="verify-form" data-verify-form>
        <input name="id" autocomplete="off" spellcheck="false" data-i18n-ph="qr.ph" aria-label="ID">
        <button class="btn btn-primary" type="submit" data-i18n="qr.btn"></button>
      </form>
      <div class="center"><a class="link-btn" href="/verify?scan=1"><span data-icon="camera" style="display:contents"></span><span data-i18n="qr.scan"></span></a></div>
    </div>
  </div>
</section>

<!-- SERVICES -->
<section id="services">
  <div class="container">
    <div class="sec-head reveal">
      <span class="kicker" data-i18n="srv.kicker"></span>
      <h2 data-i18n="srv.title"></h2>
    </div>
    <div class="grid-4">
      <article class="card reveal"><div class="ico" data-icon="building"></div><h3 data-i18n="srv.1.t"></h3><p data-i18n="srv.1.d"></p><a class="more" href="#contact" data-service="valuation" data-i18n="srv.more"></a></article>
      <article class="card reveal"><div class="ico" data-icon="chart"></div><h3 data-i18n="srv.2.t"></h3><p data-i18n="srv.2.d"></p><a class="more" href="#contact" data-service="business_plan" data-i18n="srv.more"></a></article>
      <article class="card reveal"><div class="ico" data-icon="ship"></div><h3 data-i18n="srv.3.t"></h3><p data-i18n="srv.3.d"></p><a class="more" href="#contact" data-service="import" data-i18n="srv.more"></a></article>
      <article class="card reveal"><div class="ico" data-icon="audit"></div><h3 data-i18n="srv.4.t"></h3><p data-i18n="srv.4.d"></p><a class="more" href="#contact" data-service="audit" data-i18n="srv.more"></a></article>
    </div>
  </div>
</section>

<!-- OBJECTS -->
<section class="section-soft">
  <div class="container">
    <div class="sec-head reveal">
      <span class="kicker" data-i18n="obj.kicker"></span>
      <h2 data-i18n="obj.title"></h2>
    </div>
    <div class="obj-list">
      <div class="obj reveal"><span class="check" data-icon="check"></span><span data-i18n="obj.1"></span></div>
      <div class="obj reveal"><span class="check" data-icon="check"></span><span data-i18n="obj.2"></span></div>
      <div class="obj reveal"><span class="check" data-icon="check"></span><span data-i18n="obj.3"></span></div>
      <div class="obj reveal"><span class="check" data-icon="check"></span><span data-i18n="obj.4"></span></div>
      <div class="obj reveal"><span class="check" data-icon="check"></span><span data-i18n="obj.5"></span></div>
      <div class="obj reveal"><span class="check" data-icon="check"></span><span data-i18n="obj.6"></span></div>
      <div class="obj reveal"><span class="check" data-icon="check"></span><span data-i18n="obj.7"></span></div>
      <div class="obj reveal"><span class="check" data-icon="check"></span><span data-i18n="obj.8"></span></div>
    </div>
  </div>
</section>

<!-- WHY -->
<section id="why">
  <div class="container">
    <div class="sec-head reveal">
      <span class="kicker" data-i18n="why.kicker"></span>
      <h2 data-i18n="why.title"></h2>
    </div>
    <div class="why">
      <div class="why-item reveal"><span class="num">01</span><div><h3 data-i18n="why.1.t"></h3><p data-i18n="why.1.d"></p></div></div>
      <div class="why-item reveal"><span class="num">02</span><div><h3 data-i18n="why.2.t"></h3><p data-i18n="why.2.d"></p></div></div>
      <div class="why-item reveal"><span class="num">03</span><div><h3 data-i18n="why.3.t"></h3><p data-i18n="why.3.d"></p></div></div>
      <div class="why-item reveal"><span class="num">04</span><div><h3 data-i18n="why.4.t"></h3><p data-i18n="why.4.d"></p></div></div>
    </div>
  </div>
</section>

<!-- QR VERIFICATION -->
<section class="section-dark" id="verify">
  <div class="container">
    <div class="sec-head reveal">
      <span class="kicker" data-i18n="qr.kicker"></span>
      <h2 data-i18n="qr.title"></h2>
      <p data-i18n="qr.sub"></p>
    </div>
    <div class="qr-wrap">
      <div class="qr-steps">
        <div class="qr-step reveal"><span class="n">1</span><div><h4 data-i18n="qr.s1.t"></h4><p data-i18n="qr.s1.d"></p></div></div>
        <div class="qr-step reveal"><span class="n">2</span><div><h4 data-i18n="qr.s2.t"></h4><p data-i18n="qr.s2.d"></p></div></div>
        <div class="qr-step reveal"><span class="n">3</span><div><h4 data-i18n="qr.s3.t"></h4><p data-i18n="qr.s3.d"></p></div></div>
      </div>
      <div class="qr-panel reveal">
        <div class="qr-illus" data-qr-illus></div>
        <h3 data-i18n="hero.card.t"></h3>
        <form class="verify-form" data-verify-form>
          <input name="id" autocomplete="off" spellcheck="false" data-i18n-ph="qr.ph" aria-label="ID">
          <button class="btn btn-dark" type="submit" data-i18n="qr.btn"></button>
        </form>
        <a class="link-btn" href="/verify?scan=1"><span data-icon="camera" style="display:contents"></span><span data-i18n="qr.scan"></span></a>
      </div>
    </div>
  </div>
</section>

<!-- PROCESS -->
<section id="process">
  <div class="container">
    <div class="sec-head reveal">
      <span class="kicker" data-i18n="proc.kicker"></span>
      <h2 data-i18n="proc.title"></h2>
    </div>
    <div class="steps">
      <div class="step reveal"><h3 data-i18n="proc.1.t"></h3><p data-i18n="proc.1.d"></p></div>
      <div class="step reveal"><h3 data-i18n="proc.2.t"></h3><p data-i18n="proc.2.d"></p></div>
      <div class="step reveal"><h3 data-i18n="proc.3.t"></h3><p data-i18n="proc.3.d"></p></div>
      <div class="step reveal"><h3 data-i18n="proc.4.t"></h3><p data-i18n="proc.4.d"></p></div>
      <div class="step reveal"><h3 data-i18n="proc.5.t"></h3><p data-i18n="proc.5.d"></p></div>
    </div>
  </div>
</section>

<!-- USES -->
<section class="section-soft">
  <div class="container">
    <div class="sec-head reveal">
      <span class="kicker" data-i18n="use.kicker"></span>
      <h2 data-i18n="use.title"></h2>
    </div>
    <div class="uses reveal">
      <span class="use"><span data-icon="shield" style="display:contents"></span><span data-i18n="use.1"></span></span>
      <span class="use"><span data-icon="file" style="display:contents"></span><span data-i18n="use.2"></span></span>
      <span class="use"><span data-icon="audit" style="display:contents"></span><span data-i18n="use.3"></span></span>
      <span class="use"><span data-icon="home" style="display:contents"></span><span data-i18n="use.4"></span></span>
      <span class="use"><span data-icon="chart" style="display:contents"></span><span data-i18n="use.5"></span></span>
      <span class="use"><span data-icon="ship" style="display:contents"></span><span data-i18n="use.6"></span></span>
    </div>
  </div>
</section>

<!-- FAQ -->
<section id="faq">
  <div class="container">
    <div class="sec-head reveal">
      <span class="kicker" data-i18n="faq.kicker"></span>
      <h2 data-i18n="faq.title"></h2>
    </div>
    <div class="faq">
      <details class="reveal"><summary data-i18n="faq.1.q"></summary><p data-i18n="faq.1.a"></p></details>
      <details class="reveal"><summary data-i18n="faq.2.q"></summary><p data-i18n="faq.2.a"></p></details>
      <details class="reveal"><summary data-i18n="faq.3.q"></summary><p data-i18n="faq.3.a"></p></details>
      <details class="reveal"><summary data-i18n="faq.4.q"></summary><p data-i18n="faq.4.a"></p></details>
      <details class="reveal"><summary data-i18n="faq.5.q"></summary><p data-i18n="faq.5.a"></p></details>
    </div>
  </div>
</section>

<!-- CONTACT -->
<section class="section-soft" id="contact">
  <div class="container">
    <div class="sec-head reveal">
      <span class="kicker" data-i18n="contact.kicker"></span>
      <h2 data-i18n="contact.title"></h2>
      <p data-i18n="contact.sub"></p>
    </div>
    <div class="contact">
      <div class="info-list reveal">
        <a class="info" id="infoPhone"><span class="ico" data-icon="phone"></span><span><small data-i18n="info.phone"></small><b data-cfg="phone"></b></span></a>
        <a class="info" id="infoEmail"><span class="ico" data-icon="mail"></span><span><small data-i18n="info.email"></small><b data-cfg="email"></b></span></a>
        <div class="info"><span class="ico" data-icon="pin"></span><span><small data-i18n="info.address"></small><b data-cfg="address"></b></span></div>
        <div class="info"><span class="ico" data-icon="clock"></span><span><small data-i18n="info.hours"></small><b data-cfg="hours"></b></span></div>
        <div class="info"><span class="ico" data-icon="insta"></span><span><small data-i18n="info.social"></small>
          <span class="socials" style="margin-top:6px">
            <a class="btn btn-light btn-sm" id="lnkInsta" target="_blank" rel="noopener"><span data-icon="insta" style="display:contents"></span>Instagram</a>
            <a class="btn btn-light btn-sm" id="lnkTg" target="_blank" rel="noopener"><span data-icon="send" style="display:contents"></span>Telegram</a>
          </span></span></div>
      </div>
      <form class="form reveal" id="contactForm" novalidate>
        <div class="field"><label for="cName" data-i18n="form.name"></label><input id="cName" name="name" required maxlength="100" autocomplete="name"></div>
        <div class="field"><label for="cPhone" data-i18n="form.phone"></label><input id="cPhone" name="phone" type="tel" required maxlength="40" autocomplete="tel" placeholder="+998 __ ___ __ __"></div>
        <div class="field"><label for="cService" data-i18n="form.service"></label>
          <select id="cService" name="service">
            <option value="" data-i18n="form.choose"></option>
            <option value="valuation" data-i18n="srv.1.t"></option>
            <option value="business_plan" data-i18n="srv.2.t"></option>
            <option value="import" data-i18n="srv.3.t"></option>
            <option value="audit" data-i18n="srv.4.t"></option>
          </select>
        </div>
        <div class="field"><label for="cMsg" data-i18n="form.msg"></label><textarea id="cMsg" name="message" maxlength="2000"></textarea></div>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div id="formMsg" class="alert hidden" role="status"></div>
        <button class="btn btn-primary" type="submit"><span data-icon="send" style="display:contents"></span><span data-i18n="form.send"></span></button>
      </form>
    </div>
  </div>
</section>

<div id="site-footer"></div>
</body>
</html>
