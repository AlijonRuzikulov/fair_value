# /api/health joriy versiya ID sini qaytaradi (deploy'dan keyingi testlar uchun)
[version_metadata]
binding = "CF_VERSION_METADATA"

[[kv_namespaces]]
binding = "FV_KV"
id = "d2787ce38a884e25999c69a9ab9d16de"
