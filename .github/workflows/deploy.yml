name: Fair Value — deploy va test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fairvalue-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.FV_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Secretlarni tekshirish
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::GitHub secret CLOUDFLARE_API_TOKEN qo'shilmagan"; missing=1; }
          [ -n "$ADMIN_PASSWORD" ] || { echo "::error::GitHub secret FV_ADMIN_PASSWORD qo'shilmagan"; missing=1; }
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cloudflare'ga joylash
        id: deploy
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::Deploy manzili topilmadi"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Admin parolini o'rnatish
        run: printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 secret put ADMIN_PASSWORD

      - name: Saytni tekshirish
        run: |
          sleep 10
          ./smoke-test.sh "${{ steps.deploy.outputs.url }}" | tee smoke.log
          status=${PIPESTATUS[0]}
          {
            echo "## Fair Value: ${{ steps.deploy.outputs.url }}"
            echo '```'
            cat smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
