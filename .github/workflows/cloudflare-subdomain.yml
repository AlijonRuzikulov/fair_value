name: Cloudflare — workers.dev subdomeni (o'rnatish va tekshirish)

# Qo'lda ishga tushiriladi: Actions → shu workflow → Run workflow.
# Diqqat: subdomen butun akkauntga tegishli — akkauntdagi BARCHA Worker'larning
# *.workers.dev manzili o'zgaradi.
on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: "Yangi workers.dev subdomeni (masalan: fairvalueuz)"
        required: true
        default: "fairvalueuz"

permissions:
  contents: read

jobs:
  subdomain:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEW_SUB: ${{ inputs.subdomain }}
      API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4

      - name: Akkauntni aniqlash
        run: |
          [[ "$NEW_SUB" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]] || { echo "::error::Noto'g'ri subdomen: $NEW_SUB"; exit 1; }
          if [ -z "$CF_ACCOUNT" ]; then
            resp=$(curl -s "$API/accounts" -H "Authorization: Bearer $CF_TOKEN")
            n=$(echo "$resp" | jq '.result | length')
            [ "$n" = 1 ] || { echo "::error::Token $n ta akkauntga ega — CLOUDFLARE_ACCOUNT_ID secret qo'shing"; echo "$resp" | jq -c '.errors'; exit 1; }
            CF_ACCOUNT=$(echo "$resp" | jq -r '.result[0].id')
          fi
          echo "::add-mask::$CF_ACCOUNT"
          echo "CF_ACCOUNT=$CF_ACCOUNT" >> "$GITHUB_ENV"

      - name: Subdomenni o'zgartirish
        run: |
          old=$(curl -s "$API/accounts/$CF_ACCOUNT/workers/subdomain" -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result.subdomain // "?"')
          echo "Hozirgi subdomen: $old"
          if [ "$old" = "$NEW_SUB" ]; then echo "Allaqachon $NEW_SUB"; exit 0; fi
          resp=$(curl -s -X PUT "$API/accounts/$CF_ACCOUNT/workers/subdomain" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -nc --arg s "$NEW_SUB" '{subdomain:$s}')")
          if [ "$(echo "$resp" | jq -r '.success')" != "true" ]; then
            if echo "$resp" | jq -e '.errors[]? | select(.code == 10036)' >/dev/null; then
              echo "::error::Mavjud subdomenni API orqali o'zgartirib bo'lmaydi. Cloudflare dashboard → Workers & Pages → 'Your subdomain' yonidagi Change → $NEW_SUB. Keyin shu workflow'ni qayta ishga tushiring — u yangi manzilni tekshiradi."
            else
              echo "::error::Subdomenni o'zgartirib bo'lmadi"; echo "$resp" | jq -c '.errors'
            fi
            exit 1
          fi
          echo "Yangi subdomen: $(echo "$resp" | jq -r '.result.subdomain')"

      - name: Yangi manzil ishlashini kutish
        run: |
          url="https://fairvalue.$NEW_SUB.workers.dev"
          for i in $(seq 1 40); do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$url/" || true)
            echo "[$i] $url → $c"
            [ "$c" = 200 ] && { echo "url=$url" >> "$GITHUB_ENV"; exit 0; }
            sleep 15
          done
          echo "::error::$url 10 daqiqada ochilmadi"; exit 1

      - name: Saytni tekshirish (yangi manzil)
        env:
          ADMIN_PASSWORD: ${{ secrets.FV_ADMIN_PASSWORD }}
        run: |
          ./smoke-test.sh "$url" | tee smoke.log
          status=${PIPESTATUS[0]}
          { echo "## $url"; echo '```'; cat smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: fairvalue.uz domeni Cloudflare'da bormi
        if: always()
        run: |
          resp=$(curl -s "$API/zones?name=fairvalue.uz" -H "Authorization: Bearer $CF_TOKEN")
          if [ "$(echo "$resp" | jq -r '.success')" != "true" ]; then
            echo "Zonalarni o'qishga ruxsat yo'q yoki xato:"; echo "$resp" | jq -c '.errors'
          elif [ "$(echo "$resp" | jq '.result | length')" = 0 ]; then
            echo "fairvalue.uz bu Cloudflare akkauntida YO'Q"
          else
            echo "fairvalue.uz bor, holati: $(echo "$resp" | jq -r '.result[0].status')"
          fi
